<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story Moderation — Men's DV Help</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #0b1220;
    --panel: #111a2e;
    --border: #223052;
    --text: #e6ecf5;
    --muted: #93a2bd;
    --accent: #38bdf8;
    --green: #22c55e;
    --red: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { font-size: 18px; margin: 0; }
  header button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 8px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }
  header button:hover { border-color: var(--accent); color: var(--accent); }

  #login-screen {
    max-width: 360px;
    margin: 15vh auto;
    padding: 32px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  #login-screen h2 { margin-top: 0; font-size: 18px; }
  #login-screen input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #0d1526;
    color: var(--text);
    font-size: 14px;
  }
  #login-screen button {
    width: 100%;
    padding: 10px;
    border-radius: 6px;
    border: none;
    background: var(--accent);
    color: #04121f;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  #login-error { color: var(--red); font-size: 13px; min-height: 18px; margin-top: -4px; margin-bottom: 8px; }

  main { max-width: 900px; margin: 0 auto; padding: 24px; }
  .section-title {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin: 28px 0 12px;
  }
  .story-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .story-card h3 { margin: 0 0 6px; font-size: 16px; }
  .story-meta { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .story-content { font-size: 14px; line-height: 1.5; white-space: pre-wrap; margin-bottom: 14px; }
  .story-actions { display: flex; gap: 8px; }
  .story-actions button {
    padding: 8px 16px;
    border-radius: 6px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-approve { background: var(--green); color: #04210f; }
  .btn-delete { background: var(--red); color: #2c0a0a; }
  .btn-unapprove { background: transparent; border: 1px solid var(--border) !important; color: var(--muted); }
  .empty-state { color: var(--muted); font-size: 14px; padding: 16px 0; }
  #app { display: none; }
</style>
</head>
<body>

<div id="login-screen">
  <h2>Admin Login</h2>
  <input type="email" id="login-email" placeholder="Email" value="wbballou@gmail.com" autocomplete="username">
  <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
  <div id="login-error"></div>
  <button onclick="login()">Sign In</button>
</div>

<div id="app">
  <header>
    <h1>🛡️ Story Moderation — Men's DV Help</h1>
    <button onclick="logout()">Sign Out</button>
  </header>
  <main>
    <div class="section-title">Pending Review</div>
    <div id="pending-list"></div>

    <div class="section-title">Approved &amp; Live</div>
    <div id="approved-list"></div>
  </main>
</div>

<script>
  const SUPABASE_URL = 'https://vdowulnuniwxvplvsgil.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZkb3d1bG51bml3eHZwbHZzZ2lsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE2NDMzNjcsImV4cCI6MjA5NzIxOTM2N30.5zOSE2N6Daxnb01psEnXlzqVBJpZRkNubd3Q7M3do5M';
  const AUTH_URL = SUPABASE_URL + '/auth/v1';
  const REST_URL = SUPABASE_URL + '/rest/v1/stories';
  const SESSION_KEY = 'mdvh_admin_session';

  function getSession() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); } catch(e) { return null; }
  }
  function setSession(s) { localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
  function clearSession() { localStorage.removeItem(SESSION_KEY); }

  async function login() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    errEl.textContent = '';
    if (!email || !password) { errEl.textContent = 'Enter email and password.'; return; }
    try {
      const resp = await fetch(AUTH_URL + '/token?grant_type=password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY },
        body: JSON.stringify({ email, password })
      });
      const data = await resp.json();
      if (!resp.ok) throw new Error(data.error_description || data.msg || 'Login failed');
      setSession(data);
      showApp();
    } catch (e) {
      errEl.textContent = e.message;
    }
  }

  function logout() {
    clearSession();
    document.getElementById('app').style.display = 'none';
    document.getElementById('login-screen').style.display = 'block';
  }

  function showApp() {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadStories();
  }

  async function authedFetch(url, options = {}) {
    const session = getSession();
    const headers = Object.assign({
      'apikey': SUPABASE_ANON_KEY,
      'Authorization': 'Bearer ' + (session ? session.access_token : SUPABASE_ANON_KEY),
      'Content-Type': 'application/json'
    }, options.headers || {});
    return fetch(url, Object.assign({}, options, { headers }));
  }

  async function loadStories() {
    // Pending: admin-authenticated read of unapproved rows works via the public
    // "approved = false" select policy, so this loads regardless of admin auth,
    // but we send the auth token anyway for the moderation actions below.
    const [pendingResp, approvedResp] = await Promise.all([
      authedFetch(REST_URL + '?select=*&approved=eq.false&order=id.desc'),
      authedFetch(REST_URL + '?select=*&approved=eq.true&order=id.desc')
    ]);
    const pending = pendingResp.ok ? await pendingResp.json() : [];
    const approved = approvedResp.ok ? await approvedResp.json() : [];
    renderList('pending-list', pending, true);
    renderList('approved-list', approved, false);
  }

  function escapeHtml(str) {
    return (str || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderList(elId, stories, isPending) {
    const el = document.getElementById(elId);
    if (!stories.length) {
      el.innerHTML = '<div class="empty-state">' + (isPending ? 'No stories waiting for review.' : 'No approved stories yet.') + '</div>';
      return;
    }
    el.innerHTML = stories.map(s => `
      <div class="story-card">
        <h3>${escapeHtml(s.title)}</h3>
        <div class="story-meta">By ${escapeHtml(s.name || 'Anonymous')}${s.state ? ', ' + escapeHtml(s.state) : ''} — ${escapeHtml(s.date || '')} · ${s.likes || 0} likes</div>
        <div class="story-content">${escapeHtml(s.content)}</div>
        <div class="story-actions">
          ${isPending
            ? `<button class="btn-approve" onclick="approveStory(${s.id})">Approve</button>`
            : `<button class="btn-unapprove" onclick="unapproveStory(${s.id})">Unpublish</button>`}
          <button class="btn-delete" onclick="deleteStory(${s.id})">Delete</button>
        </div>
      </div>
    `).join('');
  }

  async function approveStory(id) {
    await authedFetch(REST_URL + '?id=eq.' + id, {
      method: 'PATCH',
      headers: { 'Prefer': 'return=minimal' },
      body: JSON.stringify({ approved: true })
    });
    loadStories();
  }

  async function unapproveStory(id) {
    await authedFetch(REST_URL + '?id=eq.' + id, {
      method: 'PATCH',
      headers: { 'Prefer': 'return=minimal' },
      body: JSON.stringify({ approved: false })
    });
    loadStories();
  }

  async function deleteStory(id) {
    if (!confirm('Delete this story permanently?')) return;
    await authedFetch(REST_URL + '?id=eq.' + id, { method: 'DELETE' });
    loadStories();
  }

  // Auto-login if we already have a session
  (function init() {
    const session = getSession();
    if (session && session.access_token) {
      showApp();
    }
  })();

  document.getElementById('login-password').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });
</script>
</body>
</html>
